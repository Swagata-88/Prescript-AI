<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="600" height="780">
  <defs>
    <style>
      .clinic-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; fill: #19352A; }
      .clinic-sub { font-family: 'Inter', sans-serif; font-size: 11px; fill: #718078; }
      .label { font-family: 'Inter', sans-serif; font-size: 12px; fill: #718078; font-weight: 500; }
      .value { font-family: 'Inter', sans-serif; font-size: 13px; fill: #19352A; font-weight: 600; }
      .rx-symbol { font-family: 'Times New Roman', serif; font-size: 38px; font-weight: bold; fill: #315F49; font-style: italic; }
      .hw-clear { font-family: 'Segoe Script', 'Brush Script MT', 'Caveat', cursive, sans-serif; font-size: 20px; fill: #1A314B; }
      .hw-unclear { font-family: 'Segoe Script', 'Brush Script MT', 'Caveat', cursive, sans-serif; font-size: 21px; fill: #243547; letter-spacing: -2px; }
      .stamp-text { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: bold; fill: #4E8E6E; text-transform: uppercase; }
    </style>
    <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#FCFDFD" surfaceScale="1" result="light">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Paper Background with subtle shadow -->
  <rect x="0" y="0" width="600" height="780" fill="#FCFAF6" stroke="#E2DCD2" stroke-width="1.5" rx="6"/>
  
  <!-- Clinic Header -->
  <rect x="20" y="20" width="560" height="90" fill="#F4FAF7" rx="6" stroke="#DFECE5"/>
  <circle cx="58" cy="65" r="24" fill="#5C9F7D" fill-opacity="0.15"/>
  <path d="M58 52V78M45 65H71" stroke="#315F49" stroke-width="3.5" stroke-linecap="round"/>
  
  <text x="96" y="52" class="clinic-title">GREENVALLEY FAMILY CLINIC</text>
  <text x="96" y="70" class="clinic-sub">Dr. Arthur Vance, MD (Internal Medicine) • Reg No: MED-884210</text>
  <text x="96" y="86" class="clinic-sub">124 Healthcare Boulevard, City Hospital Zone • Tel: (022) 2490-3321</text>

  <!-- Patient Details Divider Line -->
  <line x1="20" y1="125" x2="580" y2="125" stroke="#DFECE5" stroke-width="1.5"/>

  <!-- Patient Info Row -->
  <text x="30" y="150" class="label">Patient Name:</text>
  <text x="120" y="150" class="value">Rajesh Sharma</text>
  <line x1="115" y1="154" x2="280" y2="154" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="310" y="150" class="label">Age / Sex:</text>
  <text x="380" y="150" class="value">42 Yrs / Male</text>
  <line x1="375" y1="154" x2="470" y2="154" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="30" y="180" class="label">Date:</text>
  <text x="75" y="180" class="value">08 Sep 2026</text>
  <line x1="70" y1="184" x2="200" y2="184" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="310" y="180" class="label">Vitals / BP:</text>
  <text x="385" y="180" class="value">124/82 mmHg • Temp: 99.1°F</text>
  <line x1="380" y1="184" x2="560" y2="184" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 2"/>

  <line x1="20" y1="202" x2="580" y2="202" stroke="#DFECE5" stroke-width="1.5"/>

  <!-- Rx Symbol -->
  <text x="35" y="250" class="rx-symbol">℞</text>

  <!-- Prescription Handwritten Lines (Simulating doctor handwriting) -->
  <!-- Medicine 1: Amoxicillin (Clean handwriting) -->
  <text x="65" y="295" class="hw-clear">1. Cap. Amoxicillin 500 mg</text>
  <text x="95" y="325" class="hw-clear">    1 cap bd (twice daily) x 5 days  [p.c.]</text>
  <line x1="60" y1="345" x2="540" y2="345" stroke="#EAE4D9" stroke-width="1"/>

  <!-- Medicine 2: Paracetamol (Clean handwriting) -->
  <text x="65" y="390" class="hw-clear">2. Tab. Paracetamol 650 mg</text>
  <text x="95" y="420" class="hw-clear">    1 tab SOS for fever/body ache  (Max 3 days)</text>
  <line x1="60" y1="440" x2="540" y2="440" stroke="#EAE4D9" stroke-width="1"/>

  <!-- Medicine 3: Uncertain / Illegible doctor handwriting (Unclear entry) -->
  <text x="65" y="485" class="hw-unclear">3. Tab. ~~~l~p~~ne 10mg ??</text>
  <path d="M 120 482 Q 150 470, 180 488 T 240 480 T 300 485 T 380 475" fill="none" stroke="#243547" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <text x="95" y="515" class="hw-unclear">    1 t~~ hs (night) x 10 d~~</text>
  <line x1="60" y1="535" x2="540" y2="535" stroke="#EAE4D9" stroke-width="1"/>

  <!-- General Advice note -->
  <text x="65" y="580" class="hw-clear">Adv: Plenty of warm fluids &amp; bed rest.</text>
  <text x="65" y="610" class="hw-clear">Rev: After 5 days if fever persists.</text>

  <!-- Footer Area with Stamp & Doctor Signature -->
  <g transform="translate(70, 665) rotate(-6)">
    <rect x="0" y="0" width="145" height="48" rx="4" fill="none" stroke="#5CAA7F" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="14" y="20" class="stamp-text">GREENVALLEY CLINIC</text>
    <text x="25" y="36" class="stamp-text">VERIFIED &amp; FILED</text>
  </g>

  <!-- Doctor Signature -->
  <g transform="translate(380, 650)">
    <path d="M 20 40 Q 40 10, 60 30 T 90 20 T 120 40 T 150 25" fill="none" stroke="#1A314B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="55" x2="170" y2="55" stroke="#718078" stroke-width="1"/>
    <text x="25" y="70" class="clinic-sub" style="font-weight: 600;">Dr. Arthur Vance, MD</text>
  </g>
</svg>
